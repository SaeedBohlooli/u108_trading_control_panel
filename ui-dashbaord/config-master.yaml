# Path to project config (if it exists, this is loaded instead of config.yaml)
controled_app_config_file: '../../u107_level_driven_algo/configs/config-control-panel.yaml'

# Application Configuration
# Keep it minimal - only what's essential

control_panel:
  projectName: Control Panel

  # Ports
  ports:
    vite: 7106

  # WebSocket
  websocket:
    url: ws://127.0.0.1:6107
    reconnect:
      initialDelay: 1000
      maxDelay: 30000
      backoffMultiplier: 2

  # APIs
  api:
    tradingEngineAPI: http://127.0.0.1:5107
    controlPanelUrl: http://127.0.0.1:5109

  # Footer
  footer:
    text: "Trading Control Panel"
    link: https://zoitek.com
